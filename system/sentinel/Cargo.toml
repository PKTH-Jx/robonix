[package]
name = "robonix-sentinel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Robonix Sentinel capability-call policy core"

[lib]
name = "robonix_sentinel"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
logos = "0.16.1"
nom = "8.0.0"

[dev-dependencies]
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures = "0.3"
reqwest.workspace = true
rmcp = { workspace = true, features = ["transport-child-process", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
robonix-atlas = { path = "../atlas" }
robonix-scribe.workspace = true
prost.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tonic.workspace = true
tonic-prost.workspace = true

[build-dependencies]
robonix-codegen.workspace = true
tonic-prost-build.workspace = true
protoc-bin-vendored.workspace = true
